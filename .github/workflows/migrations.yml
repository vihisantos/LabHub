name: Migrations

# Cadeia ÚNICA de migrations (Issue #285).
#
#   PR    -> validate (PostgreSQL 16 efêmero) -> migrate-staging (Supabase Staging)
#   main  -> validate (PostgreSQL 16 efêmero) -> migrate-staging + migrate (produção)
#
#   workflow_dispatch -> execução manual com seletor de destino.
#     - target=staging (padrão): aplica no Staging apenas se for branch main.
#     - target=production: aplica em Produção apenas se for branch main.
#
# A aplicação em produção depende (`needs: validate`) da validação efêmera
# ter passado: se a cadeia de migrations não aplica em um banco descartável,
# ela não é submetida ao banco real.
#
# Segredos e variáveis (Settings -> Secrets and variables -> Actions):
#   Segredos (secrets.*):
#     SUPABASE_PROJECT_REF        -> project ref de PRODUÇÃO
#     SUPABASE_ACCESS_TOKEN       -> PAT da Supabase Management API (produção)
#     BASELINE_VERSION            -> versão cuja aplicação JÁ está garantida no
#                                     banco de produção. Obrigatória em produção.
#     SUPABASE_STAGING_PROJECT_REF -> project ref do STAGING
#     SUPABASE_STAGING_ACCESS_TOKEN -> PAT da Supabase Management API (staging)
#
#   Variáveis de repositório (vars.*):
#     SUPABASE_ALLOWED_PROJECT_REFS -> allowlist de destinos, separada por
#                                     vírgula. Usada em produção.
#     SUPABASE_STAGING_ALLOWED_PROJECT_REFS -> allowlist de destinos do
#                                        STAGING, separada por vírgula.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/migrate.py"
      - "scripts/migrate/**"
      - "scripts/ci/**"
      - "scripts/tests/**"
      - ".github/workflows/migrations.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/migrate.py"
      - "scripts/migrate/**"
      - "scripts/ci/**"
      - "scripts/tests/**"
      - ".github/workflows/migrations.yml"
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente de destino para aplicação manual de migrations.'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1) validate — sempre, em PR e em main. Banco descartável, zero DEV/PROD.
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate migrations against ephemeral PostgreSQL
    runs-on: ubuntu-latest
    # Cancela execuções antigas do MESMO ref: uma validação nova torna obsoleta
    # a anterior. Só aqui cancelamos; produção nunca cancela (ver migrate).
    concurrency:
      group: migrations-validate-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install requests python-dotenv pytest "psycopg[binary]"
      - name: Unit tests do runner (mocks, sem banco)
        working-directory: scripts
        run: python -m pytest tests/test_migrations.py -q
      - name: Static TV station migration test (039)
        run: python -m pytest api/tests/test_tv_station_migration.py -q
      - name: Runner CLI --dry-run é read-only (migrations de exemplo)
        working-directory: scripts
        run: python ci/ci_dry_run_smoke.py
      - name: Suite de migrations em PostgreSQL efêmero
        working-directory: scripts
        run: python ci/ci_migration_suite.py
      - name: Valida lockdown de schema_migrations (migration 102)
        working-directory: scripts
        run: python -m pytest tests/test_schema_migrations_lockdown.py -q

  # ─────────────────────────────────────────────────────────────────────────
  # 2) migrate-staging — aplica no Supabase Staging após validate verde.
  #    Dispara em PR, push para main e workflow_dispatch com target=staging.
  #    Nunca toca em produção.
  # ─────────────────────────────────────────────────────────────────────────
  migrate-staging:
    name: Apply pending migrations to Staging
    needs: validate
    runs-on: ubuntu-latest
    # Só roda se o alvo for staging (ou workflow_dispatch com target=staging).
    # Em PR e push/main roda sempre; em workflow_dispatch só se target=staging.
    if: github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.inputs.target == 'staging')
    concurrency:
      group: migrations-apply-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal dependencies
        run: pip install requests python-dotenv

      - name: Dry-run em staging (read-only, fail-closed)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: python scripts/migrate.py --target staging --from-scratch --dry-run

      - name: Apply pending migrations to Staging
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: python scripts/migrate.py --target staging --from-scratch

  # ─────────────────────────────────────────────────────────────────────────
  # 3) migrate — só após validate verde, e só em push para main (produção).
  #    Não roda em PR nem em workflow_dispatch de outras branches.
  # ─────────────────────────────────────────────────────────────────────────
  migrate:
    name: Apply pending migrations to Production
    needs: validate
    # A aplicação em produção só ocorre em push para main (merge) ou via
    # workflow_dispatch explicitamente na main com target=production.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Habilita as protection rules do GitHub Environment (revisão/aprovação
    # manual opcional) e registra a aplicação no log do environment.
    environment: production
    # Serializa as aplicações. `cancel-in-progress: false` é obrigatório: duas
    # aplicações concorrentes em produção competem pelo advisory lock e a que for
    # cancelada no meio deixa o estado sem registro.
    concurrency:
      group: migrations-apply-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal dependencies
        run: pip install requests python-dotenv

      - name: Dry-run em produção (read-only, fail-closed)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASELINE_VERSION: ${{ secrets.BASELINE_VERSION }}
          SUPABASE_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_ALLOWED_PROJECT_REFS }}
        run: python scripts/migrate.py --target production --dry-run

      - name: Apply pending migrations to Production
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASELINE_VERSION: ${{ secrets.BASELINE_VERSION }}
          SUPABASE_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_ALLOWED_PROJECT_REFS }}
        run: python scripts/migrate.py --target production