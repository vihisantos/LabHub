name: Migrations

# Aplica migrations SQL pendentes (supabase/migrations/*.sql) no banco de
# produção via Supabase Management API, automaticamente após merge em main.
#
# Segredos necessários (Settings -> Secrets and variables -> Actions):
#   SUPABASE_PROJECT_REF   -> ex: ypkulvbllxgkjzhpzemf
#   SUPABASE_ACCESS_TOKEN  -> PAT da Supabase (escopo de Management API)
#   BASELINE_VERSION       -> (opcional) versão a partir da qual as migrations
#                             pendentes passam a ser aplicadas automaticamente.
#                             Para o banco de produção, use "035" (todas as
#                             migrations 000-035 já foram aplicadas manualmente).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"
      - "scripts/migrate.py"
      - "scripts/migrate/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal dependencies
        run: pip install requests python-dotenv

      - name: Apply pending migrations
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASELINE_VERSION: ${{ secrets.BASELINE_VERSION }}
        run: python scripts/migrate.py
