name: Local Validation Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "api/tests/**"
      - "src/apps/reservalab/api/auth.py"
      - "api/app.py"
      - "scripts/migrate.py"
      - "scripts/ci/**"
      - "scripts/tests/**"
      - ".github/workflows/local-validation.yml"

env:
  SUPABASE_CLI_VERSION: "2.50.0"
  # Portas padrão do Supabase CLI
  POSTGRES_PORT: 54322
  API_PORT: 54321
  # Desabilita migrations automáticas do CLI - gerenciadas pelo scripts/migrate.py
  SUPABASE_DB_MIGRATIONS_ENABLED: "false"

jobs:
  validate-local:
    name: Local Validation with Supabase CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/runner/work/LabHub/LabHub
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pytest psycopg[binary] jsonschema
      
      - name: Install Supabase CLI v2.50.0
        run: |
          npm install supabase@${{ env.SUPABASE_CLI_VERSION }}
          echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH
          npx supabase --version
      
      - name: Start full Supabase stack locally
        run: |
          supabase start --exclude mailpit,studio
      
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 54322 -U postgres 2>/dev/null; then
              echo "PostgreSQL ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: PostgreSQL not responding after 30 attempts"
              echo "=== Debug Info ==="
              echo "Docker containers:"
              docker ps 2>/dev/null || echo "docker not available"
              echo "Supabase status:"
              supabase status 2>/dev/null || echo "supabase status failed"
              echo "=== Container health status ==="
              docker inspect --format='{{.Name}}: {{.State.Health.Status}}' supabase_db 2>/dev/null || echo "no db health info"
              echo "=== Recent container logs ==="
              docker logs supabase_db 2>/dev/null | tail -20 || echo "no db logs"
              exit 1
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
      
      - name: Wait for Kong API (Gateway)
        run: |
          echo "Waiting for Kong API (gateway)..."
          for i in {1..30}; do
            # Check if Kong container is running and healthy
            KONG_STATUS=$(docker inspect --format='{{.State.Health.Status}}' supabase_kong 2>/dev/null || echo "unknown")
            if [ "$KONG_STATUS" = "healthy" ] || [ "$KONG_STATUS" = "starting" ]; then
              echo "Kong container status: $KONG_STATUS"
              # Wait a moment for it to be fully ready
              sleep 3
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Kong container not ready after 30 attempts (status: $KONG_STATUS)"
              echo "=== Debug Info ==="
              echo "Docker containers:"
              docker ps 2>/dev/null || echo "docker not available"
              echo "Supabase status:"
              supabase status 2>/dev/null || echo "supabase status failed"
              echo "=== Container health status ==="
              docker inspect --format='{{.Name}}: {{.State.Health.Status}}' supabase_kong 2>/dev/null || echo "no kong health info"
              docker inspect --format='{{.Name}}: {{.State.Health.Status}}' supabase_gotrue 2>/dev/null || echo "no gotrue health info"
              echo "=== Recent container logs ==="
              docker logs supabase_kong 2>/dev/null | tail -20 || echo "no kong logs"
              exit 1
            fi
            echo "Attempt $i/30... (Kong status: $KONG_STATUS)"
            sleep 2
          done
          echo "Kong API ready"
      
      - name: Wait for Auth (GoTrue)
        run: |
          echo "Waiting for Auth (GoTrue)..."
          for i in {1..30}; do
            GOTRUE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' supabase_gotrue 2>/dev/null || echo "unknown")
            if [ "$GOTRUE_STATUS" = "healthy" ] || [ "$GOTRUE_STATUS" = "starting" ]; then
              echo "GoTrue container status: $GOTRUE_STATUS"
              sleep 2
              break
            fi
            if [ $i -eq 30 ]; then
              echo "WARNING: GoTrue container not fully ready after 30 attempts (status: $GOTRUE_STATUS)"
              echo "Continuing anyway..."
              break
            fi
            echo "Attempt $i/30... (GoTrue status: $GOTRUE_STATUS)"
            sleep 2
          done
      
      - name: Verify PostgreSQL version
        run: |
          echo "=== Supabase Services Status ==="
          echo "DB URL: postgresql://postgres:postgres@localhost:54322/postgres"
          echo "API URL: http://localhost:54321"
          echo "Auth URL: http://localhost:54324"
          
          PG_VERSION=$(psql -h localhost -p 54322 -U postgres -d postgres -t -c "SHOW server_version" | tr -d '[:space:]')
          echo "PostgreSQL version: $PG_VERSION"
          if [[ ! "$PG_VERSION" =~ ^17 ]]; then
            echo "ERROR: PostgreSQL version should be 17.x, got $PG_VERSION"
            exit 1
          fi
          echo "OK: PostgreSQL 17 verified"
      
      - name: Check Supabase status
        run: |
          supabase status
      
      - name: Run local validation with protection
        run: |
          echo "=== Running local validation script ==="
          python scripts/ci/local_validate.py
      
      - name: Run migrations and tests
        run: |
          echo "=== Running migration tests ==="
          python -m pytest scripts/tests/test_url_validation.py -v
      
      - name: Stop Supabase
        if: always()
        run: |
          echo "=== Stopping Supabase services ==="
          supabase stop || echo "Supabase stop completed or already stopped"
      
      - name: Summary
        if: always()
        run: |
          echo "=== Validation Summary ==="
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: SUCCESS"
          else
            echo "Status: ${{ job.status }}"
          fi