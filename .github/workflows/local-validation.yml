name: Local Validation Suite

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "api/tests/**"
      - "src/apps/reservalab/api/auth.py"
      - "api/app.py"
      - "scripts/migrate.py"
      - "scripts/ci/**"
      - "scripts/tests/**"
      - ".github/workflows/local-validation.yml"

env:
  SUPABASE_CLI_VERSION: "2.50.0"
  # Portas padrão do Supabase CLI
  POSTGRES_PORT: 54322
  API_PORT: 54321
  # Desabilita migrations automáticas do CLI - gerenciadas pelo scripts/migrate.py
  SUPABASE_DB_MIGRATIONS_ENABLED: "false"

jobs:
  validate-local:
    name: Local Validation with Supabase CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/runner/work/LabHub/LabHub
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pytest psycopg[binary] jsonschema
      
      - name: Install Supabase CLI v2.50.0
        run: |
          npm install supabase@${{ env.SUPABASE_CLI_VERSION }}
          echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH
          npx supabase --version
      
      - name: Start full Supabase stack locally
        run: |
          supabase start --exclude mailpit,studio
      
      - name: Wait for Supabase services
        run: |
          echo "Waiting for Supabase API..."
          for i in {1..30}; do
            if curl -s http://localhost:54321/healthz | grep -q "OK"; then
              echo "Supabase API ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Supabase API not responding after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 54322 -U postgres 2>/dev/null; then
              echo "PostgreSQL ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: PostgreSQL not responding after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          
          echo "=== Supabase Services Status ==="
          echo "DB URL: postgresql://postgres:postgres@localhost:54322/postgres"
          echo "API URL: http://localhost:54321"
          
          PG_VERSION=$(psql -h localhost -p 54322 -U postgres -d postgres -t -c "SHOW server_version" | tr -d '[:space:]')
          echo "PostgreSQL version: $PG_VERSION"
          if [[ ! "$PG_VERSION" =~ ^17 ]]; then
            echo "ERROR: PostgreSQL version should be 17.x, got $PG_VERSION"
            exit 1
          fi
          echo "OK: PostgreSQL 17 verified"
      
      - name: Check Supabase status
        run: |
          supabase status
      
      - name: Run local validation with protection
        run: |
          echo "=== Running local validation script ==="
          python scripts/ci/local_validate.py
      
      - name: Stop Supabase
        if: always()
        run: |
          echo "=== Stopping Supabase services ==="
          supabase stop || echo "Supabase stop completed or already stopped"
      
      - name: Summary
        if: always()
        run: |
          echo "=== Validation Summary ==="
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: SUCCESS"
          else
            echo "Status: ${{ job.status }}"
          fi