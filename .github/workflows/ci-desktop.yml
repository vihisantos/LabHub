name: CI Desktop (Tauri 2)

# Validação do LabHub TV institucional no Windows. O workflow antigo guardava
# o lockfile do Electron (`desktop/package-lock.json`), removido na migração
# para Tauri 2 — o `setup-node` falhava antes de qualquer teste rodar.
# Agora a cadeia toda usa o lockfile raiz e o bundle desktop real:
# renderer → testes → Rust → NSIS (sem publicar release).

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Determine desktop validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test desktop scope classifier
        run: python -m unittest discover -s scripts/tests -p test_desktop_scope.py -v
      - name: Classify PR changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/desktop_scope.py

  tauri-windows:
    name: Tauri 2 checks (Windows)
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_CLOUDINARY_CLOUD_NAME: horytsxg
      VITE_CLOUDINARY_UPLOAD_PRESET: tv_events
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install root dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: TypeScript (app)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build desktop renderer
        run: npm run build:desktop:renderer

      - name: Desktop tests
        run: npx vitest run --dir src/tv-desktop

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests (physical USB test excluded)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --skip test_usb_key_verification_real

      - name: Build NSIS installer (no publish)
        run: npx tauri build --bundles nsis

      - name: Validate NSIS installer and branding
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/bundle/nsis/LabHub TV_2.4.0_x64-setup.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Instalador NSIS nao encontrado: $exe"
          }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) {
            throw "Instalador NSIS suspeitosamente pequeno: $($item.Length) bytes"
          }
          Write-Host "Installer: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)"

          $template = 'src-tauri/windows/installer.nsi'
          $hash = (Get-FileHash -LiteralPath $template -Algorithm SHA256).Hash
          if ($hash -ne 'CED7DF04EF22EFA70F3B6E6250C179536577312D91D0EE74B3E9900787049FA5') {
            throw "Hash do template NSIS mudou: $hash"
          }

          $generated = Get-ChildItem -LiteralPath 'src-tauri/target/release/nsis' `
            -Filter 'installer.nsi' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $generated -or
              -not (Select-String -LiteralPath $generated.FullName `
                    -Pattern 'by Vihisantos' -SimpleMatch -Quiet)) {
            throw 'Assinatura by Vihisantos ausente no NSIS gerado'
          }
          Write-Host 'Premium NSIS template and branding validated.'

      - name: Desktop bundle has no legacy integrations
        shell: pwsh
        run: |
          $pattern = 'supabase|chamados|heartbeat|startHeartbeat|verifyOtp|activation/redeem'
          $hits = Select-String -Path (Join-Path 'desktop/renderer' '*') `
            -Pattern $pattern -AllMatches -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Error "$($_.Filename):$($_.LineNumber): $($_.Line)" }
            throw 'O bundle desktop reintroduziu integracoes legadas'
          }
          Write-Host 'Desktop renderer bundle clean.'

  desktop-gate:
    name: Desktop CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, tauri-windows]
    if: always()
    steps:
      - name: Enforce desktop validation result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DESKTOP_REQUIRED: ${{ needs.scope.outputs.required }}
          WINDOWS_RESULT: ${{ needs.tauri-windows.result }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$DESKTOP_REQUIRED:$WINDOWS_RESULT" in
            true:success|false:skipped) echo "Desktop validation gate passed" ;;
            *) echo "Invalid desktop validation outcome" >&2; exit 1 ;;
          esac
