name: Migrations CI (ephemeral PostgreSQL)

# VALIDAÇÃO de migrations em Pull Request. Este workflow NUNCA toca em DEV/PROD:
# roda contra um PostgreSQL 16 descartável criado no próprio job (service).
# A aplicação real continua em .github/workflows/migrations.yml (pós-merge, via
# Management API). Separação FASE 8: PR valida; main aplica.
#
# Gatilho (FASE 9): somente quando algo relacionado a migrations muda. PRs que
# não tocam esses caminhos continuam sem este job.
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/migrate.py'
      - 'scripts/migrate/**'
      - 'scripts/ci/**'
      - '.github/workflows/migrations-ci.yml'

jobs:
  validate:
    name: Validate migrations against ephemeral PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install requests python-dotenv pytest "psycopg[binary]"
      - name: Unit tests do runner (mocks, sem banco)
        working-directory: scripts
        run: python -m pytest tests/test_migrations.py -q
      - name: Static TV station migration test (039)
        run: python -m pytest api/tests/test_tv_station_migration.py -q
      - name: Runner CLI --dry-run é read-only (migrations de exemplo)
        working-directory: scripts
        run: |
          python ci/ci_dry_run_smoke.py
      - name: Suite de migrations em PostgreSQL efêmero
        working-directory: scripts
        run: python ci/ci_migration_suite.py