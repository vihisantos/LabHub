name: Push Cron

# Único agendamento de push/lembretes. O worker Upstash roda como PASSO EXTRA
# deste mesmo job (não criamos outro job): não há minutos adicionais de GitHub
# Actions nem segunda execução concorrente. `concurrency` impede sobreposição
# entre execuções do schedule, e o worker usa leases no PostgreSQL + consumer
# group no Redis, então duplicatas são ACKed com segurança.
#
# Limites pequenos (publish_limit=5, consume_limit=5) mantêm o consumo de
# comandos do Upstash dentro do plano gratuito mesmo com o intervalo de 5 minutos.

on:
  schedule:
    # Deslocado do minuto 0 para fugir do pico e re-registrar o schedule.
    # Mesma frequência de 5 minutos: 03,08,13,...,58 UTC.
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-cron
  cancel-in-progress: false

jobs:
  check-all:
    name: Push check-all + notification worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/push/check-all
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o /tmp/check_all.out -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://lab-hub-pi.vercel.app/api/push/check-all")
          echo "HTTP $status"
          cat /tmp/check_all.out
          test "$status" = "200"

      - name: Call /api/notifications/worker
        # Executar mesmo se check-all falhar; não executar se o job for cancelado.
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o /tmp/worker.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --data '{"publish_limit":5,"consume_limit":5}' \
            "https://lab-hub-pi.vercel.app/api/notifications/worker")
          echo "HTTP $status"
          cat /tmp/worker.out
          test "$status" = "200"

      # #491: despachar SOMENTE a outbox de PRODUÇÃO. Reaproveita o mesmo
      # agendamento de 5 min, sem outro job/cron e sem acessar qualquer Preview.
      # Antes da ativação do servidor a rota responde enabled=false (HTTP 200).
      - name: Dispatch QStash Workflow de Chamados (Production)
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS --max-time 25 -o /tmp/chamados_dispatch.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://lab-hub-pi.vercel.app/api/chamados/workflow/outbox/dispatch")
          echo "Dispatcher Chamados: HTTP $status"
          test "$status" = "200"
          python - <<'PY'
          import json, sys
          with open("/tmp/chamados_dispatch.out", encoding="utf-8") as f:
              result = json.load(f)
          if result.get("status") != "ok" or result.get("error") or result.get("reconcile_error"):
              sys.exit("Dispatcher Chamados com erro (verifique logs de produção)")
          print("enabled={enabled} claimed={claimed} published={published} retried={retried} dead={dead} reconciled={reconciled}".format(
              **{k: result.get(k, 0) for k in (
                  "enabled", "claimed", "published", "retried", "dead", "reconciled"
              )}
          ))
          PY
