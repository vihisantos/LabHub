name: Push Cron

# Único agendamento de push/lembretes. O worker Upstash roda como PASSO EXTRA
# deste mesmo job (não criamos outro job): não há minutos adicionais de GitHub
# Actions nem segunda execução concorrente. `concurrency` impede sobreposição
# entre execuções do schedule, e o worker usa leases no PostgreSQL + consumer
# group no Redis, então duplicatas são ACKed com segurança.
#
# Limites pequenos (publish_limit=5, consume_limit=5) mantêm o consumo de
# comandos do Upstash dentro do plano gratuito mesmo com o intervalo de 5 minutos.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-cron
  cancel-in-progress: false

jobs:
  check-all:
    name: Push check-all + notification worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/push/check-all
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o /tmp/check_all.out -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://lab-hub-pi.vercel.app/api/push/check-all")
          echo "HTTP $status"
          cat /tmp/check_all.out
          test "$status" = "200"

      - name: Call /api/notifications/worker
        # Executar mesmo se check-all falhar; não executar se o job for cancelado.
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o /tmp/worker.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --data '{"publish_limit":5,"consume_limit":5}' \
            "https://lab-hub-pi.vercel.app/api/notifications/worker")
          echo "HTTP $status"
          cat /tmp/worker.out
          test "$status" = "200"

      # EXPERIMENTO #491: etapa independente e DESLIGADA por padrão.
      # Não altera check-all nem o worker de notificações. Quando habilitado
      # explicitamente no repositório, apenas drena a outbox de agendamento do
      # Workflow de Chamados (migrations 115/116). Nenhum segredo novo.
      - name: Publicar pendências do workflow de Chamados (opt-in)
        if: ${{ vars.LABHUB_CHAMADOS_WORKFLOW_DISPATCH_ENABLED == 'true' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKFLOW_DISPATCH_URL: ${{ vars.LABHUB_CHAMADOS_WORKFLOW_DISPATCH_URL }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$WORKFLOW_DISPATCH_URL" || { echo "URL de dispatch não configurada"; exit 1; }
          status=$(curl -sS -o /tmp/workflow_dispatch.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$WORKFLOW_DISPATCH_URL")
          echo "HTTP $status"
          cat /tmp/workflow_dispatch.out
          test "$status" = "200"
