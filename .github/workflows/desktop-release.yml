name: Desktop Build (Tauri 2) — manual

# ⛔ EXECUÇÃO EXCLUSIVAMENTE MANUAL (`workflow_dispatch`).
#
# Este arquivo substitui o antigo fluxo Electron, que disparava a cada merge na
# main, criava tag e GitHub Release e publicava o instalador automaticamente.
# Com a migração para Tauri 2 (PR #496) esse fluxo não tem mais consumidor:
# não existe diretório `desktop/`, nem dependências do antigo empacotador no
# código, e o player usa apenas mídia local + ativação USB.
#
# Regras deste fluxo:
#   - nenhum trigger automático (sem disparo por commit, PR ou agenda);
#   - `contents: read` — nenhuma permissão de escrita no repositório;
#   - nenhuma criação de tag, GitHub Release ou publicação externa;
#   - somente build e validação do instalador NSIS;
#   - o `.exe` fica disponível como ARTEFATO DO GITHUB ACTIONS;
#   - uma publicação assinada só será considerada após homologação física e
#     decisão explícita — nunca como efeito de merge.
#
# O nome do arquivo é mantido para preservar histórico/referências, mas ele não
# publica nada automaticamente.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-nsis:
    name: Build & validate NSIS (Windows, manual)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_CLOUDINARY_CLOUD_NAME: horytsxg
      VITE_CLOUDINARY_UPLOAD_PRESET: tv_events
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install root dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build desktop renderer
        run: npm run build:desktop:renderer

      - name: Build NSIS installer (no publish)
        run: npx tauri build --bundles nsis

      - name: Validate installer and branding
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/bundle/nsis/LabHub TV_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Instalador NSIS nao encontrado: $exe"
          }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) {
            throw "Instalador NSIS suspeitosamente pequeno: $($item.Length) bytes"
          }
          Write-Host "Installer: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)"

          $template = 'src-tauri/windows/installer.nsi'
          $hash = (Get-FileHash -LiteralPath $template -Algorithm SHA256).Hash
          if ($hash -ne 'CED7DF04EF22EFA70F3B6E6250C179536577312D91D0EE74B3E9900787049FA5') {
            throw "Hash do template NSIS mudou: $hash"
          }

          $generated = Get-ChildItem -LiteralPath 'src-tauri/target/release/nsis' `
            -Filter 'installer.nsi' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $generated -or
              -not (Select-String -LiteralPath $generated.FullName `
                    -Pattern 'by Vihisantos' -SimpleMatch -Quiet)) {
            throw 'Assinatura by Vihisantos ausente no NSIS gerado'
          }
          Write-Host 'Premium NSIS template and branding validated.'

      - name: Upload installer as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: labhub-tv-nsis-manual
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
