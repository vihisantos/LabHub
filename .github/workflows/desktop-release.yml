name: Desktop Release

# Gera o instalador NSIS do Lab Hub TV e publica no GitHub Releases.
# O feed (latest.yml + app-update.yml) é o que o electron-updater consulta
# nos kiosks. Só o alvo NSIS suporta auto-update; o portable é distribuído
# manualmente quando necessário.
#
# Importante: o feed só avança se `desktop/package.json#version` for aumentado
# a cada feature (electron-updater compara versão semântica). Bump antes de push.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/tv-desktop/**"
      - "src/apps/tv/**"
      - "vite.desktop.config.ts"
      - "desktop.html"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish TV desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install root deps
        run: npm ci

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build renderer
        run: npm run build:desktop:renderer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: horytsxg
          VITE_CLOUDINARY_UPLOAD_PRESET: tv_events

      - name: Ensure version tag exists
        # A tag PRECISA existir antes do publish: o electron-builder falha com
        # 422 "Published releases must have a valid tag" sem ela.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./desktop/package.json').version")"
          git tag "$VERSION" 2>/dev/null || true
          gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$VERSION" -f sha="${{ github.sha }}" 2>/dev/null || true

      - name: Ensure release exists for tag
        # O electron-builder publica exe e blockmap em paralelo e cada upload
        # resolve/cria a release de forma independente; quando os dois correm em
        # paralelo, o GitHub pode criar DUAS releases com a mesma tag e a tag
        # passa a resolver para a release sem latest.yml (update quebra com
        # ERR_UPDATER_CHANNEL_FILE_NOT_FOUND). Criando a release PUBLICADA antes
        # do publish, os dois uploads encontram a mesma release (<2h => permitido
        # pelo electron-builder) e todos os assets ficam nela — a tag resolve
        # para a única release com todos os assets. Idempotente: se a release
        # já existe, não faz nada.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          VERSION="v$(node -p "require('./desktop/package.json').version")"
          for attempt in 1 2 3 4 5; do
            gh api "repos/${{ github.repository }}/releases/tags/$VERSION" --jq '.id' >/dev/null 2>&1 && break
            gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$VERSION" -f name="LabHub TV $VERSION" -F draft=false >/dev/null 2>&1 && break
            sleep 2
          done
          exit 0

      - name: Build installer & publish to GitHub Releases
        run: npx electron-builder --win nsis --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Title release as Lab Hub TV (best-effort)
        # Rename é cosmético. Tags recém-criadas por API podem travar o update
        # com 422 "tag_name already exists" (eventual consistency do GitHub);
        # nesse caso o pipeline NÃO quebra — renomear manualmente depois.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          VER="v$(node -p "require('./desktop/package.json').version")"
          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/$VER" --jq '.id' 2>/dev/null)"
          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::Release $VER nao encontrada para retitle"
            exit 0
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f name="LabHub TV $VER" \
            || echo "::warning::Retitle de $VER falhou (422 tag_name); renomeie manualmente"
          exit 0