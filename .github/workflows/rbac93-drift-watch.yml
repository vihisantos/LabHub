name: RBAC 9.3-D Drift Watch

# Janela de observação do espelho workspace_ids x memberships (trigger 041 off).
# Read-only: o script só executa SELECTs; divergência inesperada falha o job
# (exit 2) para registro/investigação — nunca auto-corrige.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

jobs:
  drift:
    name: Mirror drift check (DEV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        id: secrets
        env:
          DRIFT_SUPABASE_URL: ${{ secrets.DRIFT_SUPABASE_URL }}
          DRIFT_SUPABASE_SERVICE_KEY: ${{ secrets.DRIFT_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$DRIFT_SUPABASE_URL" ] || [ -z "$DRIFT_SUPABASE_SERVICE_KEY" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "DRIFT_SUPABASE_URL/DRIFT_SUPABASE_SERVICE_KEY ausentes — pulando (adicionar secrets p/ ativar)."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Monitoring not enabled notice
        if: steps.secrets.outputs.missing == 'true'
        run: |
          echo "::warning::Drift monitor SKIPPED — DRIFT_SUPABASE_URL/DRIFT_SUPABASE_SERVICE_KEY not configured. Monitoring is NOT active until these secrets exist."

      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.missing == 'false'
        with:
          python-version: '3.12'

      - name: Run drift monitor (read-only)
        if: steps.secrets.outputs.missing == 'false'
        env:
          SUPABASE_URL: ${{ secrets.DRIFT_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DRIFT_SUPABASE_SERVICE_KEY }}
          DRIFT_LABEL: ci-dev
        run: |
          pip install requests
          python scripts/check_membership_mirror_drift.py --label ci-dev

  redis-import-staging-temp:
    name: TEMP — importador Redis -> PostgreSQL no Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: redis-import-staging-temp
      cancel-in-progress: false
    env:
      STAGING_PROJECT_REFS: 'pgmetdqsdjotdcifjivu'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependências mínimas
        run: pip install requests pytest python-dotenv
      - name: Preflight — provar destino Staging (fail-closed)
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python - <<'PY'
          import os, re, sys
          ref = os.environ.get("SUPABASE_STAGING_PROJECT_REF", "").strip()
          token = os.environ.get("SUPABASE_STAGING_ACCESS_TOKEN", "").strip()
          allowed = {p.strip() for p in os.environ.get("SUPABASE_STAGING_ALLOWED_PROJECT_REFS", "").split(",") if p.strip()}
          fixed = {p.strip() for p in os.environ.get("STAGING_PROJECT_REFS", "").split(",") if p.strip()}
          if token:
              print("::add-mask::" + token)
          if not re.fullmatch(r"[a-z0-9]{20}", ref):
              sys.exit("SUPABASE_STAGING_PROJECT_REF inválido")
          if not allowed or not fixed or ref not in allowed or ref not in fixed:
              sys.exit("Ref de Staging divergente do allowlist; abortando")
          if not token:
              sys.exit("SUPABASE_STAGING_ACCESS_TOKEN ausente")
          print("Destino Staging autorizado.")
          PY
      - name: Teste real do importador (snapshot sintético)
        env:
          LABHUB_TEST_SUPABASE_STAGING: '1'
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python -m pytest scripts/tests/test_redis_import_staging.py -q --tb=short
