# Verificação temporária e SOMENTE LEITURA do PAT da Supabase Production.
# Proibido executar o modo apply neste workflow.
name: Verify Supabase PAT - dry-run only

on:
  push:
    branches:
      - feat/upstash-notification-infra
    paths:
      - .github/workflows/verify-supabase-pat-readonly.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify production migration API access (read-only)
    if: github.repository == 'vihisantos/LabHub'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: pip install requests python-dotenv
      - name: Read-only migration dry-run (NO APPLY)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASELINE_VERSION: ${{ secrets.BASELINE_VERSION }}
          SUPABASE_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_ALLOWED_PROJECT_REFS }}
        run: python scripts/migrate.py --target production --dry-run
