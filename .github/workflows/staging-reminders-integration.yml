# Integração REAL de lembretes/Push contra o Supabase STAGING autorizado.
#
# ⛔ Execução MANUAL (workflow_dispatch). Nunca roda em push/PR, nunca é check
#    de branch protection e NUNCA referencia secrets de produção.
#
# Barreiras de destino (fail-closed, antes de qualquer escrita):
#   1. secrets.SUPABASE_STAGING_PROJECT_REF — ref do projeto Staging;
#   2. secrets.SUPABASE_STAGING_ACCESS_TOKEN — PAT da Management API;
#   3. vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS — allowlist do repositório;
#   4. STAGING_PROJECT_REFS abaixo — allowlist FIXA revisada nesta PR.
# As quatro precisam concordar. Qualquer divergência aborta sem request.
#
# A aplicação das migrations 111/112 usa o mesmo mecanismo do runner de produção:
# transação única + pg_advisory_xact_lock + registro em schema_migrations.
# Os testes criam apenas UUIDs aleatórios e removem tudo ao final.

name: Staging — lembretes PostgreSQL (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite STAGING para autorizar a aplicação da migration e os testes reais.'
        required: true
        default: ''
      apply_migration:
        description: 'Aplicar as migrations 111/112 antes dos testes?'
        required: true
        type: boolean
        default: true
      run_redis_import:
        description: 'Validar o importador Redis -> PostgreSQL com snapshot sintético?'
        required: true
        type: boolean
        default: false
      apply_outbox_migration:
        description: 'Registrar as migrations 113/114 do outbox no Staging via runner?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  STAGING_PROJECT_REFS: 'pgmetdqsdjotdcifjivu'

jobs:
  integration:
    name: Validar e testar no Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staging-reminders-integration
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências mínimas
        run: pip install requests pytest python-dotenv

      - name: Confirmção explícita
        if: ${{ inputs.confirm != 'STAGING' }}
        run: |
          echo "Confirmação inválida: informe exatamente STAGING."
          exit 1

      - name: Preflight — provar destino Staging (fail-closed)
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python - <<'PY'
          import os, re, sys
          ref = os.environ.get("SUPABASE_STAGING_PROJECT_REF", "").strip()
          token = os.environ.get("SUPABASE_STAGING_ACCESS_TOKEN", "").strip()
          allowed = {p.strip() for p in os.environ.get("SUPABASE_STAGING_ALLOWED_PROJECT_REFS", "").split(",") if p.strip()}
          fixed = {p.strip() for p in os.environ.get("STAGING_PROJECT_REFS", "").split(",") if p.strip()}
          if token:
              print("::add-mask::" + token)
          if not re.fullmatch(r"[a-z0-9]{20}", ref):
              sys.exit("SUPABASE_STAGING_PROJECT_REF inválido")
          if not allowed or not fixed or ref not in allowed or ref not in fixed:
              sys.exit("Ref de Staging divergente do allowlist; abortando")
          if not token:
              sys.exit("SUPABASE_STAGING_ACCESS_TOKEN ausente")
          print("Destino Staging autorizado.")
          PY

      - name: Dry-run da migration 111 (read-only)
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py --dry-run \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 111 no Staging
        if: ${{ inputs.apply_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 112 no Staging
        if: ${{ inputs.apply_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 112 --filename 112_chamado_reminder_read_uninitialized.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      # A 113 é idempotente: em Staging os objetos já existem, mas o runner
      # reaplica o SQL sem recriá-los e registra a versão na mesma transação.
      # A 114 falha em voz alta se função/índice/grant/RLS estiver divergente.
      - name: Aplicar migration 113 no Staging (registro oficial)
        if: ${{ inputs.apply_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 113 --filename 113_notification_outbox.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 114 no Staging (contrato da 113)
        if: ${{ inputs.apply_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 114 --filename 114_notification_outbox_contract.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Testes reais PostgreSQL (Staging)
        env:
          LABHUB_TEST_SUPABASE_STAGING: '1'
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python -m pytest api/tests/test_postgres_reminders_integration.py -q --tb=short

      - name: Importador Redis -> PostgreSQL (snapshot sintético no Staging)
        if: ${{ inputs.run_redis_import }}
        env:
          LABHUB_TEST_SUPABASE_STAGING: '1'
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python -m pytest scripts/tests/test_redis_import_staging.py -q --tb=short
