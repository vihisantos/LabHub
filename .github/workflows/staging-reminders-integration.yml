# Integração REAL de lembretes/Push contra o Supabase STAGING autorizado.
#
# ⛔ Execução MANUAL (workflow_dispatch). Nunca roda em push/PR, nunca é check
#    de branch protection e NUNCA referencia secrets de produção.
#
# Barreiras de destino (fail-closed, antes de qualquer escrita):
#   1. secrets.SUPABASE_STAGING_PROJECT_REF — ref do projeto Staging;
#   2. secrets.SUPABASE_STAGING_ACCESS_TOKEN — PAT da Management API;
#   3. vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS — allowlist do repositório;
#   4. STAGING_PROJECT_REFS abaixo — allowlist FIXA revisada nesta PR.
# As quatro precisam concordar. Qualquer divergência aborta sem request.
#
# A aplicação das migrations 111/112 usa o mesmo mecanismo do runner de produção:
# transação única + pg_advisory_xact_lock + registro em schema_migrations.
# Os testes criam apenas UUIDs aleatórios e removem tudo ao final.

name: Staging — lembretes PostgreSQL (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite STAGING para autorizar a aplicação da migration e os testes reais.'
        required: true
        default: ''
      apply_migration:
        description: 'Aplicar as migrations 111/112 antes dos testes?'
        required: true
        type: boolean
        default: true
      run_redis_import:
        description: 'Validar o importador Redis -> PostgreSQL com snapshot sintético?'
        required: true
        type: boolean
        default: false
      apply_outbox_migration:
        description: 'Registrar as migrations 113/114 do outbox no Staging via runner?'
        required: true
        type: boolean
        default: false
      apply_workflow_outbox_migration:
        description: 'Registrar as migrations 115/116 da outbox de agendamento no Staging via runner?'
        required: true
        type: boolean
        default: false
      apply_reconcile_migration:
        description: 'Registrar as migrations 117/118 da reconciliação durável no Staging via runner?'
        required: true
        type: boolean
        default: false
      preview_dispatch_url:
        description: 'URL HTTPS do Preview para smoke do dispatch (vazio = nao testar)'
        required: false
        default: ''
      run_workflow_e2e:
        description: 'Publicar de verdade no QStash com chamado sintético em workspace isolado?'
        required: true
        type: boolean
        default: false
      keep_e2e_data:
        description: 'Preservar os dados sintéticos do E2E para inspeção?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  STAGING_PROJECT_REFS: 'pgmetdqsdjotdcifjivu'

jobs:
  integration:
    name: Validar e testar no Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: staging-reminders-integration
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências mínimas
        run: pip install requests pytest python-dotenv

      - name: Confirmção explícita
        if: ${{ inputs.confirm != 'STAGING' }}
        run: |
          echo "Confirmação inválida: informe exatamente STAGING."
          exit 1

      - name: Preflight — provar destino Staging (fail-closed)
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python - <<'PY'
          import os, re, sys
          ref = os.environ.get("SUPABASE_STAGING_PROJECT_REF", "").strip()
          token = os.environ.get("SUPABASE_STAGING_ACCESS_TOKEN", "").strip()
          allowed = {p.strip() for p in os.environ.get("SUPABASE_STAGING_ALLOWED_PROJECT_REFS", "").split(",") if p.strip()}
          fixed = {p.strip() for p in os.environ.get("STAGING_PROJECT_REFS", "").split(",") if p.strip()}
          if token:
              print("::add-mask::" + token)
          if not re.fullmatch(r"[a-z0-9]{20}", ref):
              sys.exit("SUPABASE_STAGING_PROJECT_REF inválido")
          if not allowed or not fixed or ref not in allowed or ref not in fixed:
              sys.exit("Ref de Staging divergente do allowlist; abortando")
          if not token:
              sys.exit("SUPABASE_STAGING_ACCESS_TOKEN ausente")
          print("Destino Staging autorizado.")
          PY

      - name: Dry-run da migration 111 (read-only)
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py --dry-run \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 111 no Staging
        if: ${{ inputs.apply_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 112 no Staging
        if: ${{ inputs.apply_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 112 --filename 112_chamado_reminder_read_uninitialized.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      # A 113 é idempotente: em Staging os objetos já existem, mas o runner
      # reaplica o SQL sem recriá-los e registra a versão na mesma transação.
      # A 114 falha em voz alta se função/índice/grant/RLS estiver divergente.
      - name: Aplicar migration 113 no Staging (registro oficial)
        if: ${{ inputs.apply_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 113 --filename 113_notification_outbox.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 114 no Staging (contrato da 113)
        if: ${{ inputs.apply_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 114 --filename 114_notification_outbox_contract.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      # Experimento #491: tabela dedicada de agendamento, SEM reutilizar a
      # notification_outbox. Somente Staging; produção aplica pelo CI normal.
      - name: Dry-run da migration 115 (read-only)
        if: ${{ inputs.apply_workflow_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py --dry-run \
            --version 115 --filename 115_chamados_workflow_outbox.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 115 no Staging
        if: ${{ inputs.apply_workflow_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 115 --filename 115_chamados_workflow_outbox.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 116 no Staging (contrato da 115)
        if: ${{ inputs.apply_workflow_outbox_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 116 --filename 116_chamados_workflow_outbox_contract.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      # Recuperação durável de agendamentos perdidos na criação do chamado.
      - name: Dry-run da migration 117 (read-only)
        if: ${{ inputs.apply_reconcile_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py --dry-run \
            --version 117 --filename 117_chamados_workflow_outbox_reconcile.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 117 no Staging
        if: ${{ inputs.apply_reconcile_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 117 --filename 117_chamados_workflow_outbox_reconcile.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Aplicar migration 118 no Staging (contrato da 117)
        if: ${{ inputs.apply_reconcile_migration }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python scripts/apply_staging_migration.py \
            --version 118 --filename 118_chamados_workflow_outbox_reconcile_contract.sql \
            --allowed-ref "$STAGING_PROJECT_REFS"

      - name: Smoke do dispatch no Preview (somente Staging/Preview)
        if: ${{ inputs.preview_dispatch_url != '' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PREVIEW_DISPATCH_URL: ${{ inputs.preview_dispatch_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          url = os.environ.get("PREVIEW_DISPATCH_URL", "").strip()
          parsed = urlsplit(url)
          if (parsed.scheme != "https" or not parsed.hostname
              or not parsed.hostname.endswith(".vercel.app")
              or parsed.hostname == "lab-hub-pi.vercel.app"
              or parsed.path != "/api/chamados/workflow/outbox/dispatch"):
              sys.exit("URL de dispatch inválida ou de produção; abortando")
          print("Destino de Preview autorizado:", parsed.hostname)
          PY
          status=$(curl -sS -o /tmp/chamados_workflow_dispatch.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}" \
            "$PREVIEW_DISPATCH_URL")
          echo "HTTP $status"
          export STATUS="$status"
          python - <<'PY'
          import json, os, sys
          if os.environ.get("STATUS") != "200":
              sys.exit("dispatcher não respondeu 200")
          with open("/tmp/chamados_workflow_dispatch.out", encoding="utf-8") as fh:
              result = json.load(fh)
          required = ("enabled", "claimed", "published", "retried", "dead", "error",
                      "reconciled", "reconcile_error")
          missing = [key for key in required if key not in result]
          if missing:
              sys.exit(f"resposta incompleta do dispatcher: {missing}")
          if result["enabled"] is not True or result["error"] is not None:
              sys.exit("dispatcher desabilitado ou com erro")
          print("Dispatcher validado: enabled=true, error=null, "
                f"reconciled={result['reconciled']}, "
                f"reconcile_error={result['reconcile_error']!r}")
          PY

      # Publicação REAL no QStash. Opt-in: consome mensagens de verdade e usa
      # somente workspace/ticket sintéticos. Nada em produção.
      - name: E2E real QStash -> Preview protegida (Staging)
        if: ${{ inputs.run_workflow_e2e }}
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
          PREVIEW_DISPATCH_URL: ${{ inputs.preview_dispatch_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          KEEP_E2E_DATA: ${{ inputs.keep_e2e_data }}
        run: |
          python scripts/ci/chamados_workflow_e2e_staging.py

      - name: Testes reais PostgreSQL (Staging)
        env:
          LABHUB_TEST_SUPABASE_STAGING: '1'
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python -m pytest api/tests/test_postgres_reminders_integration.py -q --tb=short

      - name: Importador Redis -> PostgreSQL (snapshot sintético no Staging)
        if: ${{ inputs.run_redis_import }}
        env:
          LABHUB_TEST_SUPABASE_STAGING: '1'
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_STAGING_ALLOWED_PROJECT_REFS: ${{ vars.SUPABASE_STAGING_ALLOWED_PROJECT_REFS }}
        run: |
          python -m pytest scripts/tests/test_redis_import_staging.py -q --tb=short
